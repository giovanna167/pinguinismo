<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Penguinismo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body {
      background: linear-gradient(135deg, #0d2b45 0%, #154c60 40%, #006d77 75%, #1b4332 100%);
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    .cadastro-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .titulo-fora {
      color: #ffffff;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    .subtitulo-fora {
      color: #b0bec5;
      font-size: 15px;
      margin-bottom: 28px;
      text-align: center;
    }

    .cadastro-box {
      background: white;
      padding: 40px 35px;
      border-radius: 32px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    }
    
    .opcao-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .btn-opcao {
      width: 100%;
      padding: 18px;
      border: 2px solid #1565c0;
      background: white;
      color: #1565c0;
      font-weight: 600;
      font-size: 16px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-opcao:hover {
      background: #1565c0;
      color: white;
    }

    .form-section { display: none; }
    .form-section.active { display: flex; flex-direction: column; gap: 16px; }
    
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 14px; color: #4a4a4a; font-weight: 500; }
    input {
      padding: 16px; border: 1px solid #cccccc; border-radius: 14px; font-size: 14px; outline: none; color: #333;
      background-color: #f5f5f5;
    }
    input:focus { border-color: #1565c0; background-color: white; }
    
    .prefix-info { font-size: 12px; color: #1565c0; font-weight: 600; margin-top: 2px; }
    
    .btn-finalizar {
      background: #1565c0; color: white; border: none; padding: 18px;
      border-radius: 9999px; font-weight: 600; font-size: 16px; cursor: pointer; margin-top: 12px;
    }
    .btn-finalizar:active { background: #0d47a1; }
    
    .link-voltar { text-align: center; margin-top: 24px; font-size: 14px; color: #4a4a4a; }
    .link-voltar span { color: #1565c0; font-weight: bold; cursor: pointer; }
    
    .btn-voltar-opcao {
      background: none; border: none; color: #1565c0; font-size: 13px; cursor: pointer; font-weight: 600; margin-bottom: 8px; align-self: flex-start;
    }
  </style>
</head>
<body>

  <div class="cadastro-container">
    
    <h1 class="titulo-fora" id="main-title">Quem é você?</h1>
    <p class="subtitulo-fora" id="sub-title">Selecione o seu perfil para acessar o cadastro correto.</p>

    <div class="cadastro-box">
      
      <div id="tela-escolha">
        <div class="opcao-container">
          <button class="btn-opcao" onclick="irParaCadastroEspecifico('autista')">Sou Autista</button>
          <button class="btn-opcao" onclick="irParaCadastroEspecifico('especialista')">Sou Especialista</button>
        </div>
      </div>

      <form id="form-autista" class="form-section" onsubmit="salvarAutista(event)">
        <button type="button" class="btn-voltar-opcao" onclick="voltarParaOpcoes()">← Voltar</button>
        
        <div class="input-group">
          <label>Nome Completo</label>
          <input type="text" id="nome-aut" placeholder="Seu nome" required>
        </div>
        <div class="input-group">
          <label>CPF</label>
          <input type="text" id="cpf-aut" placeholder="000.000.000-00" required>
        </div>
        <div class="input-group">
          <label>Número do CIPTEA</label>
          <input type="text" id="ciptea" placeholder="Número da carteirinha" required>
        </div>
        <div class="input-group">
          <label>Idade</label>
          <input type="number" id="idade" placeholder="Sua idade" required>
        </div>
        <div class="input-group">
          <label>Nome de Usuário</label>
          <input type="text" id="user-aut" placeholder="Ex: gigi" required>
          <div class="prefix-info">Seu login oficial será: usua_(nome escolhido)</div>
        </div>
        <div class="input-group">
          <label>Senha</label>
          <input type="password" id="senha-aut" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-finalizar">Finalizar Cadastro</button>
      </form>

      <form id="form-especialista" class="form-section" onsubmit="salvarEspecialista(event)">
        <button type="button" class="btn-voltar-opcao" onclick="voltarParaOpcoes()">← Voltar</button>
        
        <div class="input-group">
          <label>Nome Completo</label>
          <input type="text" id="nome-esp" placeholder="Seu nome" required>
        </div>
        <div class="input-group">
          <label>CPF</label>
          <input type="text" id="cpf-esp" placeholder="000.000.000-00" required>
        </div>
        <div class="input-group">
          <label>Identidade Profissional (Ex: CRP, CRM)</label>
          <input type="text" id="registro" placeholder="Digite a sigla e o número" required>
        </div>
        <div class="input-group">
          <label>Nome de Usuário no App</label>
          <input type="text" id="user-esp" placeholder="Ex: marcos" required>
          <div class="prefix-info">Seu login oficial será: espec_(nome escolhido)</div>
        </div>
        <div class="input-group">
          <label>Senha</label>
          <input type="password" id="senha-esp" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-finalizar">Finalizar Cadastro</button>
      </form>

      <div class="link-voltar">
        Já tem uma conta? <span onclick="voltarParaLogin()">Fazer Login</span>
      </div>
    </div>
    
  </div>

  <script>
    const mainTitle = document.getElementById('main-title');
    const subTitle = document.getElementById('sub-title');

    function irParaCadastroEspecifico(perfil) {
      document.getElementById('tela-escolha').style.display = 'none';
      if (perfil === 'autista') {
        mainTitle.innerText = "Cadastro Autista";
        subTitle.innerText = "Preencha suas informações de acesso.";
        document.getElementById('form-autista').classList.add('active');
      } else {
        mainTitle.innerText = "Cadastro Especialista";
        subTitle.innerText = "Validação por identidade de conselho profissional.";
        document.getElementById('form-especialista').classList.add('active');
      }
    }

    function voltarParaOpcoes() {
      mainTitle.innerText = "Quem é você?";
      subTitle.innerText = "Selecione o seu perfil para acessar o cadastro correto.";
      document.getElementById('tela-escolha').style.display = 'block';
      document.getElementById('form-autista').classList.remove('active');
      document.getElementById('form-especialista').classList.remove('active');
    }

    function voltarParaLogin() {
      window.location.href = 'login.html'; 
    }

    function salvarAutista(event) {
      event.preventDefault();
      const nicknameDigitado = document.getElementById('user-aut').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
      const usuarioFinal = 'usua_' + nicknameDigitado;
      
      const dados = {
        nome: document.getElementById('nome-aut').value,
        cpf: document.getElementById('cpf-aut').value,
        ciptea: document.getElementById('ciptea').value,
        idade: document.getElementById('idade').value,
        username: usuarioFinal,
        senha: document.getElementById('senha-aut').value
      };

      fetch('http://localhost:3000/api/cadastro/autista', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados)
      })
      .then(res => res.json())
      .then(data => {
        if(data.sucesso) {
          alert('Cadastro realizado no MySQL!\nSeu usuário para login é: ' + data.usuario);
          voltarParaLogin();
        } else {
          alert('Erro ao cadastrar no banco de dados.');
        }
      })
      .catch(err => alert('Erro: O servidor server.js está desligado!'));
    }

    
    function salvarEspecialista(event) {
      event.preventDefault();
      const nicknameDigitado = document.getElementById('user-esp').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
      const usuarioFinal = 'espec_' + nicknameDigitado;

      const dados = {
        nome: document.getElementById('nome-esp').value,
        cpf: document.getElementById('cpf-esp').value,
        registro: document.getElementById('registro').value,
        username: usuarioFinal,
        senha: document.getElementById('senha-esp').value
      };

      fetch('http://localhost:3000/api/cadastro/especialista', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados)
      })
      .then(res => res.json())
      .then(data => {
        if(data.sucesso) {
          alert('Cadastro de Especialista realizado no MySQL!\nSeu usuário para login é: ' + data.usuario);
          voltarParaLogin();
        } else {
          alert('Erro ao cadastrar no banco de dados.');
        }
      })
      .catch(err => alert('Erro: O servidor server.js está desligado!'));
    }
  </script>
</body>
</html>
